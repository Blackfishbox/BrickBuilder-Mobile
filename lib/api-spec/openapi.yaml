openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /catalog/snapshot/{sha256}:
    get:
      operationId: getMappingCatalogSnapshot
      tags: [catalog]
      summary: Read the pinned complete public catalog mapping snapshot
      parameters:
        - in: path
          name: sha256
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{64}$"
      responses:
        "200":
          description: Gzip-compressed catalog bytes, without HTTP Content-Encoding
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Snapshot not approved
        "503":
          description: Approved snapshot unavailable
  /ldraw/file:
    get:
      operationId: getLDrawFile
      tags: [geometry]
      summary: Read an approved original LDraw file
      description: Fixed official source only. Exact source bytes, without HTTP content encoding. Optional operator-approved archive takes precedence.
      parameters:
        - in: query
          name: path
          required: true
          schema:
            type: string
            maxLength: 180
      responses:
        "200":
          description: Exact original bytes; X-LDraw-SHA256 and X-LDraw-Snapshot identify the source
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid normalized path
        "404":
          description: File unavailable
        "429":
          description: Rate limited; Retry-After is provided
        "502":
          description: Unsafe, oversized or unavailable upstream response
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

