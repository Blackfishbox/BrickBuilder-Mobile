apply plugin: 'com.android.application'

def requestedCode = System.getenv("BRICKBUILDER_VERSION_CODE") ?: "1"
if (!(requestedCode ==~ /[1-9][0-9]{0,9}/) || requestedCode.toLong() > 2100000000) {
    throw new GradleException("BRICKBUILDER_VERSION_CODE must be 1..2100000000")
}
def requestedName = System.getenv("BRICKBUILDER_VERSION_NAME") ?: "0.1.0"
if (!(requestedName ==~ /[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?/)) {
    throw new GradleException("Invalid BRICKBUILDER_VERSION_NAME")
}
def uploadStore = System.getenv("ANDROID_UPLOAD_STORE_FILE")
def signingNames = ["ANDROID_UPLOAD_STORE_FILE", "ANDROID_UPLOAD_STORE_PASSWORD", "ANDROID_UPLOAD_KEY_ALIAS", "ANDROID_UPLOAD_KEY_PASSWORD"]
def signingCount = signingNames.count { System.getenv(it) }
if ((signingCount != 0 && signingCount != signingNames.size()) ||
    (System.getenv("ANDROID_REQUIRE_SIGNING") == "true" && signingCount != signingNames.size())) {
    throw new GradleException("Release signing requires all four upload-key environment variables")
}

android {
    namespace = "io.github.blackfishbox.brickbuilder"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.blackfishbox.brickbuilder"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode requestedCode.toInteger()
        versionName requestedName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (uploadStore) {
            upload {
                storeFile file(uploadStore)
                storePassword System.getenv("ANDROID_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("ANDROID_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            if (uploadStore) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

